name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 技能测试
        run: npm test
      - name: 插件测试
        run: npm run test:plugin
      - name: 技能副本同步校验（sync 后不得有差异）
        run: npm run sync && git diff --exit-code
      - name: 版本号一致性校验
        run: node scripts/check-release.mjs
